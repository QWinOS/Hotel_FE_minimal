name: Deploy Strapi to Elastic Beanstalk (Cost-Effective)

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "20.19.5"
  EB_APPLICATION_NAME: hotel-sweet-home
  EB_ENVIRONMENT_NAME: Hotel-sweet-home-env

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --only=production

      - name: Build Strapi
        run: npm run build

      - name: Install Python and EB CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install awsebcli

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "[default]" > ~/.aws/config
          echo "region = ${{ secrets.AWS_REGION }}" >> ~/.aws/config

      - name: Initialize EB CLI
        run: |
          eb init ${{ env.EB_APPLICATION_NAME }} --region ${{ secrets.AWS_REGION }} --platform "Node.js"

      - name: Deploy to Elastic Beanstalk
        run: |
          eb deploy ${{ env.EB_ENVIRONMENT_NAME }} --timeout 20
